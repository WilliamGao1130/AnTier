name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
    # 显式把仓库 Secrets 传给被调用的 build-apk.yml，
    # 否则 workflow_call 场景可能拿不到 ANTHER_KEYSTORE_* 导致 release 未签名。
    secrets: inherit
    # 标记来自 Release 流程：禁止“带 v* 标签跳过构建”生效。
    with:
      from_release: 'true'

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**
          generate_release_notes: true
