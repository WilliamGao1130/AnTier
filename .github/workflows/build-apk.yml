name: Build APK

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANTHER_KEYSTORE_BASE64: ${{ secrets.ANTHER_KEYSTORE_BASE64 }}
      ANTHER_KEYSTORE_PASSWORD: ${{ secrets.ANTHER_KEYSTORE_PASSWORD }}
      ANTHER_KEY_ALIAS: ${{ secrets.ANTHER_KEY_ALIAS }}
      ANTHER_KEY_PASSWORD: ${{ secrets.ANTHER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12.0
          packages: 'build-tools;34.0.0 platform-tools platforms;android-35'

      - name: Remove stale local.properties
        run: rm -f local.properties

      - name: Decode release signing keystore
        if: env.ANTHER_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANTHER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/antier-release.jks"
          echo "ANTHER_KEYSTORE_FILE=$RUNNER_TEMP/antier-release.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK (signed when secrets configured)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antier-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
